name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: bash .github/scripts/install-lint-tools.sh

      - name: Run SwiftLint
        run: swiftlint

      - name: Run SwiftFormat
        run: swiftformat . --lint

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: bash .github/scripts/install-lint-tools.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -scheme PRMonitor -configuration Debug build

      - name: Test
        run: xcodebuild -scheme PRMonitor -configuration Debug -destination 'platform=macOS' test
